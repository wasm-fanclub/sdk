name: Publish SDK
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
  actions: write
env:
  IMAGE_NAME: sdk
jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Get Build Arguments
        run: |
          BUILD_ARGS=$(cat ./init/tags.env)
          echo "BUILD_ARGS<<EOF" >> $GITHUB_ENV
          echo "$BUILD_ARGS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Build intermediate image
        uses: docker/build-push-action@v6
        with:
          push: false
          file: docker/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:intermediate
          build-args: ${{ env.BUILD_ARGS }}
          load: true
      - name: Get PATH from intermediate image
        id: get-path
        run: |
          LAST_LINE=$(docker run --rm ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:intermediate "printenv PATH" | tail -n 1)
          echo "AGGREGATED_PATH=$LAST_LINE" >> $GITHUB_ENV
      - name: Inject new PATH
        run: |
          sed -i "/^ENTRYPOINT/i ENV PATH=${{ env.AGGREGATED_PATH }}" docker/Dockerfile
      - name: Build and Publish Docker Image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: docker/Dockerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            ${{ env.BUILD_ARGS }}
      - name: Dump-test Latest Image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run dump-test.yml --ref=${{ github.event.release.tag_name || github.ref_name }}
      - name: Pin and Optimize Cloud-Init
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pin-tag.yml --ref=${{ github.event.release.tag_name || github.ref_name }} --field metadata_ref=${{ github.event.release.tag_name || github.ref_name }}
