name: Pin and Optimize Cloud-Init and Dockerfile

on:
  workflow_dispatch:
    inputs:
      metadata_ref:
        description: 'Release tag to pin'
        required: true
      path:
        description: 'PATH value to set in Dockerfile'
        required: true
      publish:
        description: 'Publish updated tag'
        type: boolean
        default: false

env:
  METADATA_REF: ${{ github.event.inputs.metadata_ref }}
  AGGREGATED_PATH: ${{ github.event.inputs.path }}

permissions:
  contents: write

jobs:
  pin-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Install yq
        run: |
          VERSION=v4.48.1
          PLATFORM=linux_amd64

          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_${PLATFORM} -O /usr/local/bin/yq &&\
          chmod +x /usr/local/bin/yq
      - name: Bump Cloud-Init Ref
        run: |
          yq -i '(.write_files[] | select(.path == "/etc/cloud/metadata.ref")).content = strenv(METADATA_REF)' multipass/cloud-init.yml
      - name: Commit and Push changes
        run: |
          git add multipass/cloud-init.yml
          git commit -m "Pin cloud-init metadata ref to ${METADATA_REF}" || echo "No changes to commit"
          git push origin main || true
      - name: Optimize /opt/init Scripts
        run: |
          SCRIPT_CONTENT=$(yq -r '.write_files[] | select(.path == "/opt/init/init.sh").content' multipass/cloud-init.yml)
          TARGET_BLOCK=$(awk '/^ *SCRIPTS=\(/,/^\)/ { print }' <<< "$SCRIPT_CONTENT")

          eval "$TARGET_BLOCK"

          for script in "${SCRIPTS[@]}"; do
            SRC_FILE="./init/$script"

            sed -i 's/\r$//' "$SRC_FILE"

            yq -i \
              ".write_files += [{
                \"path\": \"/opt/init/$script\",
                \"content\": load_str(\"$SRC_FILE\")
              }]" multipass/cloud-init.yml
            yq -i \
              "(.write_files[] | select(.path == \"/opt/init/$script\") | .content) style=\"literal\"" multipass/cloud-init.yml
          done
      - name: Inject new PATH
        run: |
          sed -i "/^ENTRYPOINT/i ENV PATH=${{ env.AGGREGATED_PATH }}" docker/Dockerfile
      - name: Force point tag to a headless commit
        if: ${{ github.event.inputs.publish }}
        run: |
          git checkout --detach
          git add multipass/cloud-init.yml
          git add docker/Dockerfile
          git commit -m "Optimize cloud-init.yml and Dockerfile per ${METADATA_REF}"
          git tag -f ${METADATA_REF}
          git push origin -f ${METADATA_REF}
      - name: Dump results
        run: |
          echo "Cloud-Init YAML:"
          cat multipass/cloud-init.yml
          echo ""
          echo "Dockerfile:"
          cat docker/Dockerfile